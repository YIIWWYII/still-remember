<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
@font-face{font-family:'Remember Serif','Noto Serif SC','Songti SC','SimSun',serif;src:url('assets/serif.ttf') format('truetype')}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0f1e9;color:#2c3733;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(1000px,86vw);text-align:center}
.eyebrow{font-family:Georgia,serif;font-size:11px;letter-spacing:.16em;color:#7b817c}
.quote{font-family:'Remember Serif','Noto Serif SC','Songti SC','SimSun',serif;font-size:54px;line-height:1.7;margin-top:28px;color:#2c3733}
.quote span{color:#8a5a44}
.rule{width:64px;height:1px;background:#c9a18d;margin:42px auto 0}
.brand{margin-top:40px;font-family:'Remember Serif','Noto Serif SC','Songti SC','SimSun',serif;font-size:25px;line-height:1.4}
.brand small{display:block;font-family:Georgia,serif;font-size:9px;letter-spacing:.12em;color:#778079;margin-top:8px}
.small{position:absolute;left:0;right:0;bottom:54px;text-align:center;font-size:10px;line-height:1.9;color:#8b938a}
</style></head><body>
<div class="center">
  <p class="eyebrow">STILL, REMEMBER · 2026</p>
  <p class="quote">记得，不是留住时间，<br>是让时间<span>有回声</span>。</p>
  <div class="rule"></div>
  <p class="brand">仍然记得<small>让这个世界仍然记得。</small></p>
</div>
<p class="small">设计文件 · design/still-remember-letters　|　页面 · 寄往将来</p>
</body></html>
